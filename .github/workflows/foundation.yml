name: Foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m venv .venv-codegen
      - run: .venv-codegen/bin/python -m pip install -r scripts/codegen/requirements.txt
      - run: python -m compileall -q services/drivers/vgc-benlink/validation
      - run: bash -n services/drivers/vgc-benlink/transports/macos/run_mac_bluetooth_probe.sh
      - run: npm run generate:driver
      - run: git diff --exit-code -- packages/radio-driver-sdk/src/generated packages/radio-driver-sdk/generated
      - run: npm run check
      - run: npm run check:driver
      - run: npm run simulate
      - run: npm run export:web
  container:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build --build-arg VCS_REF=${{ github.sha }} -f deploy/api.Dockerfile -t signaldock-api:test .
      - run: docker run -d --name signaldock-api-test --read-only --cap-drop=ALL --security-opt=no-new-privileges -p 127.0.0.1:3000:3000 signaldock-api:test
      - run: curl --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 --max-time 5 --fail http://127.0.0.1:3000/api/v1/health
      - if: always()
        run: docker logs signaldock-api-test && docker rm -f signaldock-api-test
