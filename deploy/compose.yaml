services:
  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      SIGNALDOCK_DISPLAY_NAME: SignalDock station
      SIGNALDOCK_ALLOWED_ORIGINS: http://localhost:8081
    volumes:
      - instance-data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  instance-data:
