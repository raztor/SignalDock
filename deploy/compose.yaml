name: signaldock
x-backend: &backend
  build:
    context: ..
    dockerfile: deploy/api.Dockerfile
  environment: &backend-env
    DATABASE_URL: ${DATABASE_URL:?}
    SIGNALDOCK_DISPLAY_NAME: ${SIGNALDOCK_DISPLAY_NAME:-SignalDock station}
    SIGNALDOCK_ALLOWED_ORIGINS: ${SIGNALDOCK_ALLOWED_ORIGINS:-http://localhost:8080}
    SIGNALDOCK_COOKIE_ORIGIN: ${SIGNALDOCK_COOKIE_ORIGIN:-}
    SIGNALDOCK_BASE_PATH: ${SIGNALDOCK_BASE_PATH:-}
    SIGNALDOCK_EMBEDDED_JOBS: 'false'
    LIVEKIT_URL: ${LIVEKIT_URL:-}
    LIVEKIT_INTERNAL_URL: ${LIVEKIT_INTERNAL_URL:-}
    LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
    LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
  volumes: [instance-data:/data]
  read_only: true
  tmpfs: ['/tmp:rw,noexec,nosuid,size=128m,uid=1000,gid=1000']
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  stop_grace_period: 45s
  depends_on:
    db: { condition: service_healthy }
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: signaldock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: signaldock
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U signaldock -d signaldock']
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: [no-new-privileges:true]
  api:
    <<: *backend
    ports: ['127.0.0.1:3000:3000']
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000'+(process.env.SIGNALDOCK_BASE_PATH||'')+'/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    <<: *backend
    command: [node, apps/api/dist/worker.js]
  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args: { WEB_BASE_PATH: '${WEB_BASE_PATH:-}' }
    ports: ['127.0.0.1:8080:8080']
    read_only: true
    tmpfs:
      [
        '/tmp:rw,noexec,nosuid,size=32m',
        '/etc/nginx/conf.d:rw,noexec,nosuid,size=1m,uid=101,gid=101,mode=0755',
      ]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  livekit:
    image: livekit/livekit-server:v1.13.11
    profiles: [media]
    command:
      [
        --config,
        /etc/livekit.yaml,
        --keys,
        '${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}',
      ]
    volumes: ['./livekit.yaml:/etc/livekit.yaml:ro']
    ports:
      ['127.0.0.1:7880:7880', '7881:7881/tcp', '50000-50100:50000-50100/udp']
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m']
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
volumes:
  instance-data:
  postgres-data:
